x-geometry-algorithm:
  description: |
    ## Parallel-Offset Gap Algorithm

    The `get_sector_path_parallel` method computes petal shapes as WPF Path
    geometry strings using a parallel-offset approach for uniform gaps:

    1. Calculate sector boundary angles: `θ₁ = center - span/2`, `θ₂ = center + span/2`
    2. Compute radial unit vectors `d₁`, `d₂` for each boundary
    3. Compute perpendicular normals `n₁`, `n₂` pointing inward
    4. Offset each boundary by `gap_width/2` along its normal
    5. Solve intersection with inner/outer circles: `t = √(r² - offset²)`
    6. Generate 4 corner points and connect with lines and arcs

    The formula produces:
    ```
    p_in1  = center + offset·n₁ + t_in·d₁    (inner arc, boundary 1)
    p_out1 = center + offset·n₁ + t_out·d₁   (outer arc, boundary 1)
    p_in2  = center + offset·n₂ + t_in·d₂    (inner arc, boundary 2)
    p_out2 = center + offset·n₂ + t_out·d₂   (outer arc, boundary 2)
    ```

    WPF Path: `M p_in1 L p_out1 A r_out 0 0,1 p_out2 L p_in2 A r_in 0 0,0 p_in1 Z`

x-legacy-migration:
  description: |
    ## Configuration Migration

    The `load_config()` function handles three legacy formats:

    ### Format 1: Flat Array (v0.x)
    ```json
    [
      {"slot": 1, "type": "built_in", "name": "Zoom", "command": "zoom", "icon": "🔍"},
      ...
    ]
    ```
    Migrated by wrapping in `{"contexts": {"default": [...]}}` and calling
    `migrate_old_config()`.

    ### Format 2: Context Dictionary (v1.x)
    ```json
    {
      "settings": {...},
      "contexts": {
        "default": [...slots...],
        "pipes": [...slots...]
      }
    }
    ```
    Migrated by extracting the `default` context (or first non-empty),
    converting slot numbers to level/parent/priority, and building a
    flat `command_pool`.

    ### Format 3: Current Pool Format (v2.x)
    ```json
    {
      "settings": {...},
      "command_pool": [
        {"id": "...", "level": 1, "parent": null, "priority": 10, ...}
      ]
    }
    ```

    ### Slot-to-Level Mapping (Legacy)
    | Slot Range | Level | Parent    |
    |------------|-------|-----------|
    | 1–10       | 1     | null      |
    | 11–20      | 2     | submenu1  |
    | 21–30      | 3     | submenu2  |

x-event-flow:
  mouse-hook:
    description: |
      ## Win32 Mouse Hook Event Flow

      ```
      WM_RBUTTONDOWN (0x0204)
        → Record cursor position
        → Set _is_holding = True
        → Increment _hold_id_counter
        → Spawn hold_detection_worker thread

      hold_detection_worker:
        → sleep(hold_delay_ms / 1000)
        → Check _is_holding && _hold_id_counter match
        → If valid: trigger_radial_menu(x, y)

      WM_RBUTTONUP (0x0205)
        → Set _is_holding = False
        → Cancel pending hold if menu not opened

      WM_MOUSEMOVE (0x0200)
        → If holding: check movement threshold
        → If moved > 10px: cancel hold
      ```

  command-execution:
    description: |
      ## Command Execution Flow

      ```
      User clicks petal
        → on_button_clicked_dynamic(sender, args)
        → on_slot_clicked(slot_num)
        → Look up pool item from _button_to_pool_item
        → If submenu command: toggle_level2() / toggle_level3()
        → If executable: _event_handler.set_action(execute_command, type, value)
        → _ext_event.Raise()
        → Revit calls Execute() on main thread
        → execute_command(uiapp, cmd_type, cmd_value)
        → Close menu window
      ```
